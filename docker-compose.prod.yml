# Production stack for the AWS EC2 server.
#
# Differences from docker-compose.yml (local):
#   - Caddy sits in front on ports 80/443 and gets a free HTTPS certificate
#     automatically once SITE_ADDRESS is set to your domain.
#   - MySQL, Redis, Elasticsearch and nginx are NOT published to the internet.
#   - No Mailpit; mail goes through the real SMTP server set in .env.
#   - Every service restarts automatically after a crash or server reboot.
#   - A scheduler container runs Laravel/Bagisto scheduled tasks.
#
# Put COMPOSE_FILE=docker-compose.prod.yml in the server's .env so plain
# `docker compose ...` commands use this file.

x-app-env: &app-env
  APP_ENV: production
  APP_DEBUG: "false"
  APP_URL: ${APP_URL:?Set APP_URL in .env}
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: 3306
  DB_DATABASE: ${DB_DATABASE:-bagisto}
  DB_USERNAME: ${DB_USERNAME:-bagisto}
  DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
  REDIS_HOST: redis
  REDIS_PORT: 6379
  ELASTICSEARCH_HOST: http://elasticsearch:9200

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    image: freshcart-app:prod
    restart: unless-stopped
    env_file:
      - .env
    environment: *app-env
    command: >-
      sh -c "php artisan migrate --force && php artisan config:cache && php artisan view:cache && exec php-fpm -F"
    volumes:
      - app-storage:/var/www/html/storage
    networks:
      - app
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

  scheduler:
    image: freshcart-app:prod
    restart: unless-stopped
    env_file:
      - .env
    environment: *app-env
    command: php artisan schedule:work
    volumes:
      - app-storage:/var/www/html/storage
    networks:
      - app
    depends_on:
      - app

  nginx:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    image: freshcart-web:prod
    restart: unless-stopped
    volumes:
      - app-storage:/var/www/html/storage:ro
    networks:
      - app
    depends_on:
      - app
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/health | grep -q OK"]
      interval: 10s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      # ":80" = plain HTTP on the server's IP. Set to "shop.example.com" for HTTPS.
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - app
    depends_on:
      nginx:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-bagisto}
      MYSQL_USER: ${DB_USERNAME:-bagisto}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - app
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - app
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - app
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null"]
      interval: 20s
      timeout: 10s
      retries: 10

networks:
  app:
    driver: bridge

volumes:
  app-storage:
  mysql-data:
  redis-data:
  elasticsearch-data:
  caddy-data:
  caddy-config:
